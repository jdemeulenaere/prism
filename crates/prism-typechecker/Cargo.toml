[package]
name = "prism-typechecker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
prism-ast = { path = "../prism-ast" }
prism-abi = { path = "../prism-abi" }
prism-typed-tree = { path = "../prism-typed-tree" }
# The bundled prelude for tests that build a checker directly (`test_prelude`).
prism-parser = { path = "../prism-parser", optional = true }
prism-library = { path = "../prism-library", optional = true }

[features]
# `test_prelude()`: the prelude scope of the bundled library, for the tests of every crate
# that builds a checker without the CLI's driver (task 4.7 of `standard-library`).
test-support = ["dep:prism-parser", "dep:prism-library"]

[dev-dependencies]
prism-parser = { path = "../prism-parser" }
prism-library = { path = "../prism-library" }
# The integration tests (`tests/regressions.rs`) use `test_prelude`.
prism-typechecker = { path = ".", features = ["test-support"] }
