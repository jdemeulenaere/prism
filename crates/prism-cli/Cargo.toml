[package]
name = "prism-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
[lib]
name = "prism_cli"
path = "src/lib.rs"

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
prism-ast = { path = "../prism-ast" }
prism-lexer = { path = "../prism-lexer" }
prism-parser = { path = "../prism-parser" }
prism-abi = { path = "../prism-abi" }
prism-resolver = { path = "../prism-resolver" }
prism-typechecker = { path = "../prism-typechecker" }
prism-mir = { path = "../prism-mir" }
prism-borrowck = { path = "../prism-borrowck" }
prism-compose-transform = { path = "../prism-compose-transform" }
prism-typed-tree = { path = "../prism-typed-tree" }
prism-formatter = { path = "../prism-formatter" }
prism-codegen = { path = "../prism-codegen" }
prism-runtime = { path = "../prism-runtime" }
prism-library = { path = "../prism-library" }
# File-system events for `prism run --watch` (D15 of `hot-reload`): FSEvents on macOS, inotify on
# Linux, ReadDirectoryChangesW on Windows, with a polling fallback. Pinned exactly; 8.2.0 was
# released on 2025-08-03 under CC0-1.0.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
# The bundled prelude for the tests that build a checker directly.
prism-typechecker = { path = "../prism-typechecker", features = ["test-support"] }
prism-mir = { path = "../prism-mir" }
prism-borrowck = { path = "../prism-borrowck" }
# The compile-time benchmark (tests/compile_timing.rs) times Cranelift's compilation apart from
# the backend's lowering, at the backend's pinned version.
cranelift-codegen = "=0.136.2"
cranelift-jit = "=0.136.2"
cranelift-module = "=0.136.2"
cranelift-native = "=0.136.2"
