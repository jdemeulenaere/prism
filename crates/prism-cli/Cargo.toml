[package]
name = "prism-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
[lib]
name = "prism_cli"
path = "src/lib.rs"

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
prism-ast = { path = "../prism-ast" }
prism-lexer = { path = "../prism-lexer" }
prism-parser = { path = "../prism-parser" }
prism-abi = { path = "../prism-abi" }
prism-resolver = { path = "../prism-resolver" }
