schema: spec-driven

# Project context (optional)
context: |
  Prism Language Architecture & Non-Negotiable Invariants:
  - Single-file compilation units: each `.prism` file compiles independently. Default visibility is `private`. All `public` and `package` declarations MUST declare explicit parameter and return types for Phase 1 independent ABI extraction.
  - Zero build files, zero marker files: the workspace root comes from matching the file path to its package declaration.
  - Deterministic hermetic builds: Phase 1 extracts exported ABI hashes; Phase 2 compiles bodies. Body edits must produce zero downstream recompilations.
  - Kotlin-like syntax without grammatical ambiguity.
  - Zero-cost memory: zero GC, zero hidden ARC, no lifetime annotations (`'a`). Value ownership, stack borrows, `Heap<T>` for recursive types, typed handles for graphs.
  - First-class UI primitives: `compose` modifier (`compose fun`) and slot-table state handles (`State<T>`, `NodeId`).
  - Cite invariants by name, not number.
  - Implementation tasks must follow the Elephant-Goldfish model: clear behavioral requirements/scenarios in specs, technical decisions in design.md, and testable checklist in tasks.md.
  - The normative invariants are openspec/specs/system-invariants/spec.md; the lines above summarize them.
  - openspec/specs/ describes only implemented behavior. Planned designs live in docs/architecture.md: a change implementing one copies the relevant requirements into its delta specs and removes them from docs/architecture.md.
  - openspec/changes/archive/ is history, never a source of truth for current behavior.
  - Only propose a change for decisions (new semantics, grammar rules, new or reassigned error codes, changed scenarios, architecture). Bugs where the spec already implies the right behavior are plain fixes with regression tests and no change packet (AGENTS.md section 1).
  - Every compiler error code is listed in openspec/specs/diagnostics/spec.md; a change adding an error takes the next unused code in its stage's range and adds it there.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance
operations:
  apply:
    guidance:
      - Before marking the change complete, run cargo fmt --all -- --check, cargo clippy --workspace --all-targets, cargo test --workspace, and prism check on every file under examples/, with no exemption.
      - Keep examples/ formatted - run prism fmt --check examples/ (cargo run -q -p prism-cli -- fmt --check examples/) and, if it lists files, format them with prism fmt examples/ and read the diff before committing.
      - Run the executable examples - prism run --check-allocations examples/run/main.prism (cargo run -q -p prism-cli -- run --check-allocations examples/run/main.prism) must exit with status 0, print what its source computes and report no leak or invalid free; prism run on any other file under examples/ must report a diagnostic (E6001 or E6002, or the errors prism check reports) rather than crash. Each UI entry (examples/apps/counter/main.prism, examples/apps/todo/main.prism, examples/apps/todo/large.prism and examples/demo/ui/ui.prism) must run with prism run --check-allocations --headless <entry> with status 0 and empty stderr, and their sessions (examples/**/sessions/*.events) run in cargo test as example_app_sessions; never run them without --headless, which would open a window.
      - Compile speed is a primary design criterion (user, 2026-10-19). When a change adds or alters a compiler stage or analysis, add its shapes to crates/prism-cli/tests/compile_timing.rs and run PRISM_ASSERT_TIMING=1 cargo test --release -p prism-cli --test compile_timing -- --ignored --nocapture; growth must stay roughly linear, and the design must state the stage's cost.
  archive:
    guidance:
      - Promote key design decisions from design.md into a "## Design Rationale" section of the affected main spec, so agents never need to read the archive.
      - Add every non-goal, deferral or follow-up from proposal.md and design.md to ROADMAP.md as an unchecked item, naming the change it came from.
      - Remove from docs/architecture.md any planned requirement that this change implemented, and tick the matching ROADMAP.md item.
