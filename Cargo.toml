[workspace]
resolver = "2"
members = [
    "crates/prism-ast",
    "crates/prism-lexer",
    "crates/prism-parser",
    "crates/prism-abi",
    "crates/prism-cli",
    "crates/prism-resolver",
    "crates/prism-typechecker",
    "crates/prism-typed-tree",
    "crates/prism-mir",
    "crates/prism-borrowck",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Prism Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jdemeulenaere/prism"
