[workspace]
resolver = "2"
members = [
    "crates/prism-ast",
    "crates/prism-lexer",
    "crates/prism-parser",
    "crates/prism-abi",
    "crates/prism-cli",
    "crates/prism-resolver",
    "crates/prism-typechecker",
    "crates/prism-typed-tree",
    "crates/prism-mir",
    "crates/prism-borrowck",
    "crates/prism-formatter",
    "crates/prism-runtime",
    "crates/prism-codegen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Prism Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jdemeulenaere/prism"

# The build cache hashes the compiler executable on every cached run (D5 of `abi-cache`), which
# an unoptimized BLAKE3 would make slow in debug builds.
[profile.dev.package.blake3]
opt-level = 3
